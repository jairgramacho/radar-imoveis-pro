<title>{{ seo_title|default('Radar Imoveis Pro | Imoveis em Barreiras e Oeste da Bahia', true) }}</title>
<meta name="description" content="{{ seo_description|default('Encontre imoveis para compra e aluguel em Barreiras e no Oeste da Bahia.', true) }}">
<meta name="keywords" content="{{ seo_keywords|default('imoveis em barreiras, imobiliaria barreiras, casas em barreiras, apartamentos barreiras, imoveis oeste da bahia', true) }}">
<meta name="robots" content="{{ seo_robots|default('index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1', true) }}">
<link rel="canonical" href="{{ seo_canonical_url|default(request.url, true) }}">

<meta property="og:locale" content="{{ seo_locale|default('pt_BR', true) }}">
<meta property="og:type" content="{{ seo_og_type|default('website', true) }}">
<meta property="og:title" content="{{ seo_title|default('Radar Imoveis Pro | Imoveis em Barreiras e Oeste da Bahia', true) }}">
<meta property="og:description" content="{{ seo_description|default('Encontre imoveis para compra e aluguel em Barreiras e no Oeste da Bahia.', true) }}">
<meta property="og:url" content="{{ seo_canonical_url|default(request.url, true) }}">
<meta property="og:site_name" content="{{ seo_site_name|default('Radar Imoveis Pro', true) }}">
<meta property="og:image" content="{{ seo_og_image|default(url_publica('og_placeholder', tipo='Radar Imoveis Pro', cidade='Barreiras'), true) }}">
<meta property="og:image:secure_url" content="{{ seo_og_image|default(url_publica('og_placeholder', tipo='Radar Imoveis Pro', cidade='Barreiras'), true) }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="628">

<meta name="twitter:card" content="{{ seo_twitter_card|default('summary_large_image', true) }}">
<meta name="twitter:title" content="{{ seo_title|default('Radar Imoveis Pro | Imoveis em Barreiras e Oeste da Bahia', true) }}">

<meta name="twitter:image" content="{{ seo_og_image|default(url_publica('og_placeholder', tipo='Radar Imoveis Pro', cidade='Barreiras'), true) }}">

{% if seo_prev_url %}<link rel="prev" href="{{ seo_prev_url }}">{% endif %}
{% if seo_next_url %}<link rel="next" href="{{ seo_next_url }}">{% endif %}

{% for schema in seo_json_ld_list or [] %}
<script type="application/ld+json">{{ schema | tojson }}</script>
{% endfor %}

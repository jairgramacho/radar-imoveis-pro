name: Deploy Render

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  workflow_run:
    workflows:
      - Testes
    types:
      - completed

concurrency:
  group: deploy-render-main
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Validar secret de deploy
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Secret RENDER_DEPLOY_HOOK_URL nao configurado no GitHub."
            exit 1
          fi

      - name: Disparar deploy no Render
        run: |
          curl --fail --silent --show-error \
            --request POST \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"